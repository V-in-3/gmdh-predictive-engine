
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gmdh-postgres
    environment:
      POSTGRES_DB: airflow_db
      POSTGRES_USER: airflow_user
      POSTGRES_PASSWORD: airflow_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow_user -d airflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmdh_net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: gmdh-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,DOCKER://gmdh-kafka:29092'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - gmdh_net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: gmdh-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-c']
    command: |
      "
      echo 'Waiting for Kafka to be fully ready...'
      sleep 15
      kafka-topics --bootstrap-server gmdh-kafka:29092 --create --if-not-exists --topic raw-subscriptions --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server gmdh-kafka:29092 --alter --topic raw-subscriptions --partitions 3 2>/dev/null
      kafka-topics --bootstrap-server gmdh-kafka:29092 --create --if-not-exists --topic subscriptions_dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server gmdh-kafka:29092 --create --if-not-exists --topic system-monitor --partitions 1 --replication-factor 1
      echo 'Topics created/verified successfully'
      "
    networks:
      - gmdh_net

  localstack:
    image: localstack/localstack:2.3.2
    container_name: gmdh-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kinesis,s3
      - DEFAULT_REGION=us-east-1
      - KINESIS_PROVIDER=kinesis-mock
      - KINESIS_INITIALIZE_STREAMS=telemetry-stream:1
      - SKIP_INFRA_DOWNLOADS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmdh_net

  gmdh-ollama:
    image: ollama/ollama:latest
    container_name: gmdh-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gmdh_net

  ollama-init:
    image: curlimages/curl:latest
    container_name: gmdh-ollama-init
    depends_on:
      gmdh-ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-tinyllama}
    entrypoint: >
      sh -c "curl -sf http://gmdh-ollama:11434/api/pull -d \"{\\\"name\\\": \\\"$$OLLAMA_MODEL\\\"}\" > /dev/null && echo \"$$OLLAMA_MODEL ready\""
    restart: "no"
    networks:
      - gmdh_net

  airflow-init:
    build: .
    container_name: gmdh-airflow-init
    restart: "no"
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
    environment: &airflow-env
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow_user:airflow_pass@gmdh-postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__WEBSERVER__WORKER_TIMEOUT=120
      - AIRFLOW__CORE__DAG_CONCURRENCY=2
      - AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=1
      - KINESIS_ENDPOINT=http://gmdh-localstack:4566
      - REGION=us-east-1
      - PYTHONPATH=/opt/airflow/project
      - OLLAMA_MODEL=${OLLAMA_MODEL:-tinyllama}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - SKIP_GATES=${SKIP_GATES:-false}
      - DEMO_MODE=${DEMO_MODE:-true}
      - POSTGRES_HOST=gmdh-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=airflow_db
      - POSTGRES_USER=airflow_user
      - POSTGRES_PASSWORD=airflow_pass
    command: >-
      bash -c "
      pip install --quiet langgraph langchain-core groq &&
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com;
      airflow connections delete postgres_default;
      airflow connections add postgres_default --conn-type postgres --conn-host gmdh-postgres --conn-port 5432 --conn-login airflow_user --conn-password airflow_pass --conn-schema airflow_db &&
      python /opt/airflow/project/scripts/init_pgvector_tables.py &&
      python /opt/airflow/project/scripts/load_seed_cases.py
      "
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - gmdh_net

  airflow-webserver:
    build: .
    container_name: gmdh-airflow
    ports:
      - "8080:8080"
      - "8000:8000"
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
    environment: *airflow-env
    command: >-
      bash -c "
      pip install --quiet langgraph langchain-core groq &&
      cd /opt/airflow/project && (uvicorn api.serve:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &) &&
      airflow webserver --port 8080
      "
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - gmdh_net

  airflow-scheduler:
    build: .
    container_name: gmdh-airflow-scheduler
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
    environment: *airflow-env
    command: >-
      bash -c "
      pip install --quiet langgraph langchain-core groq &&
      airflow scheduler
      "
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - gmdh_net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: gmdh-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=*
      - GF_PLUGIN_CATALOG_URL=
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gmdh_net

volumes:
  postgres_data:
  kafka_data:
  ollama_data:
  grafana_data:

networks:
  gmdh_net:
    driver: bridge
